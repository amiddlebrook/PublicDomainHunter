name = "publicdomainhunter"
main = "cloudflare/worker-d1.ts"
compatibility_date = "2024-10-26"

# D1 Database - The ONLY backend we need!
[[d1_databases]]
binding = "DB"
database_name = "publicdomainhunter_db"
database_id = "519084b3-f731-4fbf-80ff-c5e14e05e512"

# Static Assets (Next.js frontend)
[assets]
directory = "frontend/out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# Optional: KV namespace for sessions (not required for basic auth)
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your-kv-namespace-id"
