name = "publicdomainhunter"
main = "cloudflare/worker.ts"
compatibility_date = "2026-09-26"

# Public Domain Hunter v2 has no required database or separate backend service.
# Optional: bind a KV namespace named CACHE for 15-minute API response caching.

[assets]
directory = "frontend/out"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "single-page-application"

[build]
command = "npm run build"

[observability.logs]
enabled = true
invocation_logs = true
