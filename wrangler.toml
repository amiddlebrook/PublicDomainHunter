name = "publicdomainhunter"
main = "cloudflare/worker.ts"
compatibility_date = "2026-10-16"

# Free-tier baseline: one Worker serves both the API and prebuilt static assets.
# No database, queues, or paid AI model is required.

[assets]
directory = "./frontend/out"
binding = "ASSETS"
run_worker_first = ["/api/*", "/", "/opportunities", "/portfolio", "/methodology", "/patents"]
html_handling = "none"
not_found_handling = "404-page"

[observability.logs]
enabled = true
