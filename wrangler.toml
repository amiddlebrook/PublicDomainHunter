name = "publicdomainhunter"
main = "cloudflare/worker.ts"
compatibility_date = "2024-10-26"

[vars]
# Update this to the publicly accessible URL where your FastAPI backend is deployed.
BACKEND_URL = "https://your-backend.example.com"

# OAuth Configuration (set these in Cloudflare dashboard or .dev.vars for local dev)
# GOOGLE_CLIENT_ID = "your-google-client-id"
# GOOGLE_CLIENT_SECRET = "your-google-client-secret"
# GITHUB_CLIENT_ID = "your-github-client-id"
# GITHUB_CLIENT_SECRET = "your-github-client-secret"
# SESSION_SECRET = "your-session-secret-min-32-chars"

# KV Namespace for session storage (OPTIONAL - for OAuth features)
# To enable OAuth login (Google/GitHub):
# Option 1 (Dashboard):
#   1. Go to https://dash.cloudflare.com/ > Workers & Pages > KV
#   2. Click "Create namespace" and name it "SESSIONS"
#   3. Copy the namespace ID
#   4. Uncomment the lines below and replace the placeholder IDs
# Option 2 (CLI): Run `npx wrangler kv namespace create "SESSIONS"` locally
#
# Uncomment these lines after creating your KV namespace:
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your-kv-namespace-id-here"
# preview_id = "your-preview-kv-namespace-id-here"

[assets]
directory = "frontend/out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[build]
command = "npm --prefix frontend install && npm --prefix frontend run cf:build"
