name = "publicdomainhunter"
main = "cloudflare/worker.ts"
compatibility_date = "2024-10-26"

[vars]
# ⚠️  IMPORTANT: Update this to your FastAPI backend URL
#
# For Cloudflare Pages deployment:
#   Set this in Cloudflare Dashboard → Pages → Settings → Environment Variables
#   Variable name: BACKEND_URL
#   Example value: https://api.yourdomain.com
#
# For local development:
#   Set this in .dev.vars file (create from .dev.vars.example)
#   Example: BACKEND_URL=http://localhost:8000
#
# See CLOUDFLARE_PAGES_SETUP.md for complete deployment instructions
BACKEND_URL = "https://your-backend.example.com"

# OAuth Configuration
# IMPORTANT: For security, set these as secrets (not in this file!)
#
# For LOCAL development:
#   1. Copy .dev.vars.example to .dev.vars
#   2. Add your OAuth credentials to .dev.vars
#   3. Never commit .dev.vars to git
#
# For PRODUCTION deployment (Cloudflare Pages):
#   Set these in Cloudflare Dashboard → Pages → Settings → Environment Variables
#   Mark GOOGLE_CLIENT_SECRET and GITHUB_CLIENT_SECRET as "Encrypt" for security
#   OR use Wrangler: wrangler secret put GOOGLE_CLIENT_ID
#
# See CLOUDFLARE_AUTH_SETUP.md for complete OAuth setup instructions

# ⚠️  KV Namespace for session storage - CONFIGURE VIA DASHBOARD
#
# For Cloudflare Pages deployment (RECOMMENDED):
#   The KV namespace section below is COMMENTED OUT to allow initial deployment.
#   After deployment succeeds, configure KV binding through the dashboard:
#
#   1. Create KV namespace: Dashboard → Workers & Pages → KV → Create namespace (name: "SESSIONS")
#   2. Bind it to your Pages project:
#      - Go to: Dashboard → Pages → publicdomainhunter → Settings → Functions
#      - Scroll to: KV namespace bindings
#      - Click "Add binding"
#      - Variable name: SESSIONS
#      - KV namespace: Select the namespace you created
#   3. Redeploy (happens automatically on next push)
#
# For local development with wrangler CLI:
#   1. Run: wrangler kv namespace create "SESSIONS"
#   2. Run: wrangler kv namespace create "SESSIONS" --preview
#   3. Uncomment the section below and update with the IDs from those commands
#
# See CLOUDFLARE_PAGES_SETUP.md for detailed instructions

# COMMENTED OUT: Uncomment and update IDs for local wrangler deployments
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "your-kv-namespace-id"          # ← Replace with your production KV namespace ID
# preview_id = "your-preview-kv-namespace-id"  # ← Replace with your preview KV namespace ID

[assets]
directory = "frontend/out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[build]
command = "npm --prefix frontend install && npm --prefix frontend run cf:build"
