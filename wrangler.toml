name = "publicdomainhunter"
main = "cloudflare/worker.ts"
compatibility_date = "2024-10-26"

[vars]
# Update this to the publicly accessible URL where your FastAPI backend is deployed.
BACKEND_URL = "https://your-backend.example.com"

# OAuth Configuration (set these in Cloudflare dashboard or .dev.vars for local dev)
# GOOGLE_CLIENT_ID = "your-google-client-id"
# GOOGLE_CLIENT_SECRET = "your-google-client-secret"
# GITHUB_CLIENT_ID = "your-github-client-id"
# GITHUB_CLIENT_SECRET = "your-github-client-secret"
# SESSION_SECRET = "your-session-secret-min-32-chars"

# KV Namespace for user data and sessions
# To enable authentication features, create a KV namespace:
#
# Option 1 - Cloudflare Dashboard (Recommended):
#   1. Go to https://dash.cloudflare.com/ > Workers & Pages > KV
#   2. Click "Create namespace" and name it "AUTH_STORE"
#   3. Copy the namespace ID
#   4. Go to your Pages project > Settings > Functions
#   5. Add KV namespace binding: Variable name = "AUTH_STORE", KV namespace = select "AUTH_STORE"
#
# Option 2 - Wrangler CLI:
#   Run: npx wrangler kv namespace create "AUTH_STORE"
#   Then uncomment the lines below and paste the namespace ID
#
# For local development with wrangler dev, you can use:
# [[kv_namespaces]]
# binding = "AUTH_STORE"
# id = "your-production-namespace-id"
# preview_id = "your-preview-namespace-id"

[assets]
directory = "frontend/out"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[build]
command = "npm --prefix frontend install && npm --prefix frontend run cf:build"
