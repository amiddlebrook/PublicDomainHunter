services:
  # Backend API Service
  - type: web
    name: publicdomainhunter-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: publicdomainhunter-db
          property: connectionString

  # PostgreSQL Database
  - type: pgsql
    name: publicdomainhunter-db
    databaseName: public_domain_hunter
    plan: starter
