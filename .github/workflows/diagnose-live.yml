name: Diagnose public Worker URL
on:
  push:
    paths: [.github/workflows/diagnose-live.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public routes
        shell: bash
        run: |
          set -u
          BASE="https://publicdomainhunter.averymiddlebrook2014.workers.dev"
          for path in "/" "/index.html" "/opportunities" "/opportunities.html" "/api/health" "/api/methodology" "/api/opportunities?q=folklore&source=gutenberg&limit=2" "/api/opportunities?q=folklore&source=archive&limit=2"; do
            echo "::group::GET $path"
            curl -sS --max-time 25 -D /tmp/pdh-headers -o /tmp/pdh-body -w 'status=%{http_code} size=%{size_download} redirect=%{redirect_url}\n' "$BASE$path" || true
            head -n 15 /tmp/pdh-headers
            echo "body-bytes=$(wc -c < /tmp/pdh-body)"
            head -c 500 /tmp/pdh-body
            echo
            echo "::endgroup::"
          done
          for url in 'https://gutendex.com/books/?search=folklore' 'https://gutendex.com/books?search=folklore' 'https://archive.org/advancedsearch.php?q=folklore%20AND%20mediatype:texts&rows=1&output=json' 'https://openlibrary.org/search.json?q=folklore&limit=1' 'https://www.gutenberg.org/ebooks/search/?query=folklore'; do
            echo "::group::UPSTREAM $url"
            curl -sS --max-time 20 -D /tmp/upstream-headers -o /tmp/upstream-body -w 'status=%{http_code} size=%{size_download}\n' "$url" || true
            head -n 5 /tmp/upstream-headers
            head -c 260 /tmp/upstream-body
            echo
            echo "::endgroup::"
          done
