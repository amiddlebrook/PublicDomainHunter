name: Validate and deploy Cloudflare app

on:
  push:
    branches: [main, develop, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build and validate Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The v2 migration removed the obsolete frontend lockfile. Install the root workspace.
      - name: Install root and frontend workspaces
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run evidence and licensing tests
        run: npm test
      - name: Build static Next.js frontend
        run: npm run build
      - name: Validate Cloudflare bundle without publishing
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

  deploy:
    name: Publish to Cloudflare Workers
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Missing CLOUDFLARE_API_TOKEN repository secret; see README deployment section.'
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Detach obsolete v1 Queue consumer without deleting the queue
        # The old Worker registered itself against publicdomainhunter-jobs.
        # That consumer prevents a fetch-only Worker from being deployed.
        # The compatibility queue handler preserves queued messages if
        # this step lacks Cloudflare Queues permissions.
        continue-on-error: true
        run: npx wrangler queues consumer remove publicdomainhunter-jobs publicdomainhunter
      - name: Deploy Worker and static Next.js assets
        run: npx wrangler deploy
      - name: Health check (when public URL is configured)
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 3 "$PUBLIC_URL/api/health" | grep '"ok":true'
