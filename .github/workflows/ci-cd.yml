name: Validate and deploy Cloudflare app

on:
  push:
    branches: [main, develop, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build and validate Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The v2 migration removed the obsolete frontend lockfile. Install the root workspace.
      - name: Install root and frontend workspaces
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run evidence and licensing tests
        run: npm test
      - name: Build static Next.js frontend
        run: npm run build
      - name: Validate Cloudflare bundle without publishing
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

  deploy:
    name: Publish to Cloudflare Workers
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Missing CLOUDFLARE_API_TOKEN repository secret; see README deployment section.'
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Detach obsolete v1 Queue consumer without deleting the queue
        # The old Worker registered itself against publicdomainhunter-jobs.
        # That consumer prevents a fetch-only Worker from being deployed.
        # The compatibility queue handler preserves queued messages if
        # this step lacks Cloudflare Queues permissions.
        continue-on-error: true
        run: |
          result=$(npx wrangler queues consumer remove publicdomainhunter-jobs publicdomainhunter 2>&1) && {
            echo "$result"
            exit 0
          }
          if echo "$result" | grep -q "No worker consumer 'publicdomainhunter' exists"; then
            echo "Retired Queue consumer was previously detached."
            exit 0
          fi
          echo "$result"
          exit 1
      - name: Deploy Worker and static Next.js assets
        run: npx wrangler deploy
      - name: Smoke test deployed homepage and live API
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://publicdomainhunter.averymiddlebrook2014.workers.dev' }}
        run: |
          set -euo pipefail
          PUBLIC_URL="${PUBLIC_URL%/}"
          echo "Checking public Worker deployment at $PUBLIC_URL"
          curl --fail --show-error --silent --retry 5 --retry-delay 3 --max-time 30 "$PUBLIC_URL/api/health" -o /tmp/pdh-health.json
          node -e 'const h = require("/tmp/pdh-health.json"); if (!h.ok || h.architecture !== "cloudflare-native") process.exit(1); console.log("Health:",h.version)'
          curl --fail --show-error --silent --retry 5 --retry-delay 3 --max-time 30 "$PUBLIC_URL/" -o /tmp/pdh-home.html
          node -e 'const fs = require("fs"); const html = fs.readFileSync("/tmp/pdh-home.html", "utf8"); console.log("Homepage length:", html.length, "Preview:", html.slice(0, 240)); if (!html.includes("Public Domain Hunter") || !html.includes("<html")) process.exit(1)'
          curl --fail --show-error --silent --retry 5 --retry-delay 3 --max-time 30 "$PUBLIC_URL/api/methodology" -o /tmp/pdh-methodology.json
          node -e 'const m = require("/tmp/pdh-methodology.json"); if (m.version !== "evidence-first-v2") process.exit(1)'
          curl --fail --show-error --silent --retry 3 --retry-delay 3 --max-time 40 "$PUBLIC_URL/api/opportunities?q=folklore&source=archive&limit=2" -o /tmp/pdh-opportunities.json
          node -e 'const r = require("/tmp/pdh-opportunities.json"); if (!Array.isArray(r.opportunities) || !r.methodology) process.exit(1); console.log("Search returned",r.opportunities.length,"opportunities")'
          curl --fail --show-error --silent --retry 3 --retry-delay 3 --max-time 40 "$PUBLIC_URL/api/opportunities?q=folklore&source=gutenberg&limit=2" -o /tmp/pdh-gutenberg.json
          node -e 'const r = require("/tmp/pdh-gutenberg.json"); if (!Array.isArray(r.opportunities) || !["gutendex","internet-archive-gutenberg"].includes(r.provider)) process.exit(1); console.log("Gutenberg provider:",r.provider)'
          echo "Live website and API smoke tests passed."
