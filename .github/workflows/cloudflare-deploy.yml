name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker to Cloudflare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: '.'
          command: deploy

      - name: Deployment Success
        run: |
          echo "✅ Deployed successfully!"
          echo "🌐 Site: https://publicdomainhunter.averymiddlebrook2014.workers.dev/"
          echo "🏥 Health: https://publicdomainhunter.averymiddlebrook2014.workers.dev/auth/health"
          echo ""
          echo "⚙️ Next steps:"
          echo "1. Set BACKEND_URL in Cloudflare Dashboard"
          echo "2. Deploy FastAPI backend"
          echo "3. Test registration"
